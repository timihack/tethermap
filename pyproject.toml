[project]
name = "tethermap"
version = "0.1.0"
description = "MCP platform that predicts what a software change will break and reconstructs why a failure happened"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
]

[project.scripts]
tethermap = "tethermap.mcp_server.server:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tethermap"]

[tool.pytest.ini_options]
testpaths = ["tests"]